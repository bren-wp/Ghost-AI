# Ghost AI by Brendigo
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: [dependencies]
    groups:
      ghost-ai-frontend:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: [dependencies]
    groups:
      ghost-ai-rust:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: [dependencies]
    groups:
      ghost-ai-ci:
        patterns: ['*']
