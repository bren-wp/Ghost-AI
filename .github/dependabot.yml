# Ghost AI by Brendigo
# Keep dependency upgrades visible and reviewable. Never auto-merge.
# Major API migrations must pass full desktop/agent tests and release gates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    groups:
      ghost-ai-npm-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ghost-ai-npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    groups:
      ghost-ai-desktop-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ghost-ai-desktop-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /vendor/agent
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    groups:
      ghost-ai-agent-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ghost-ai-agent-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    groups:
      ghost-ai-actions:
        patterns: ["*"]
