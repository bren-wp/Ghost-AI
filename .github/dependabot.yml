# Ghost AI by Brendigo
# Stabilization: prevent new automatic *version-update* PRs from competing
# with the single active release PR #40. GitHub security alerts/updates and
# mandatory pnpm/RustSec security gates remain enabled. After v0.1.3 merges,
# deliberately re-enable version upgrades with fresh lockfiles and QA.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 0
    groups:
      ghost-ai-npm-nonbreaking:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ghost-ai-npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 0
    groups:
      ghost-ai-cargo-nonbreaking:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ghost-ai-cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 0
    groups:
      ghost-ai-actions:
        patterns: ["*"]
