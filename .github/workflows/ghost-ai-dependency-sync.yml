# Temporary branch-only lockfile synchronization for Ghost AI PR #40.
# Never runs on main, PR events or untrusted forks; remove before merge.
name: Ghost AI PR 40 dependency lock reconciliation

on:
  push:
    branches:
      - fix/ghost-ai-main-rust-visual-gates-20261122
    paths:
      - 'package.json'
      - 'src-tauri/Cargo.toml'
      - 'vendor/agent/Cargo.toml'
      - '.github/workflows/ghost-ai-dependency-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfiles:
    if: github.repository == 'bren-wp/Ghost-AI' && github.ref == 'refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolve pnpm overrides and changed packages
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve desktop Cargo.lock without removing version constraints
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Resolve shared agent Cargo.lock
        run: cargo metadata --manifest-path vendor/agent/Cargo.toml --format-version 1 > /dev/null
      - name: Verify frozen frontend lockfile
        run: pnpm install --frozen-lockfile
      - name: Save regenerated lockfiles on the same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml src-tauri/Cargo.lock vendor/agent/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already consistent; no commit needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(lockfiles): reconcile consolidated Ghost AI upgrades'
          git push origin HEAD:refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122
