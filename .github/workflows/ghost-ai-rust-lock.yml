name: Ghost AI Rust Dependency Lock
on:
  push:
    branches: ['release/v0.1.1']
    paths: ['scripts/ghost-rust-lock.sync']
permissions:
  contents: write
concurrency:
  group: ghost-ai-rust-lock
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve matching Rust crates
        run: |
          cargo update --manifest-path src-tauri/Cargo.toml
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Verify Rust packages match the TypeScript packages
        run: |
          python3 scripts/ghost_verify_tauri.py
      - name: Save validated Cargo lockfile
        run: |
          git config user.name "Ghost AI Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): resolve compatible Tauri and Rust lockfile"
            git pull --rebase origin release/v0.1.1
            git push origin HEAD:release/v0.1.1
          fi
