# One-time trusted PR #26 npm lockfile security remediation.
# Delete after the patched lockfile is committed and re-audited.
name: Ghost AI npm vulnerability remediation
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/ghost-ai-npm-remediation.yml

jobs:
  regenerate-npm-lockfile:
    if: ${{ github.event.pull_request.number == 26 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ghost-ai-dark-responsive-localization' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Resolve patched linkify-it dependency
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Test pinned dependencies and links
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm test
      - name: Require zero reported npm vulnerabilities of any severity
        shell: bash
        run: |
          pnpm audit --audit-level low
      - name: Preserve candidate lockfile for review even if audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-AI-Patched-Npm-Lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Commit verified lockfile to trusted PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(deps): remove vulnerable linkify-it 3.x from npm lockfile'
          git push origin HEAD:refs/heads/fix/ghost-ai-dark-responsive-localization
