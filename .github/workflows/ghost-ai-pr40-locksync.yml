# Temporary maintainer-only lockfile reconciliation for PR #40.
# Remove this branch-only write-enabled workflow after lockfiles are committed.
name: PR40 Rust dependency lockfile repair

on:
  push:
    branches:
      - fix/ghost-ai-main-rust-visual-gates-20261122
    paths:
      - 'src-tauri/Cargo.toml'
      - 'vendor/agent/Cargo.toml'
      - '.github/workflows/ghost-ai-pr40-locksync.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.repository == 'bren-wp/Ghost-AI' && github.ref == 'refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve desktop and shared agent Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --manifest-path vendor/agent/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path vendor/agent/Cargo.toml --format-version 1 >/dev/null
      - name: Commit only the corrected Cargo lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/Cargo.lock vendor/agent/Cargo.lock
          if git diff --cached --quiet; then
            echo "Both Cargo lockfiles are already consistent"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(lockfiles): resolve stable rig and rand for Ghost AI'
          git push origin HEAD:refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122
