# Ghost AI by Brendigo
name: Ghost AI Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghost-ai-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: App quality and legal checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Signed manifest tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Review first-party code for maintainability and risk
        run: python3 scripts/ghost-ai-code-audit.py --output reports/ghost-ai-code-audit.md
      - name: Save Ghost AI source review
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-AI-Code-Review
          path: reports/ghost-ai-code-audit.md
          if-no-files-found: error
      - name: Verify legal notices and brand assets
        shell: bash
        run: |
          test -s legal/EULA-EN.txt
          test -s legal/EULA-HR.md
          test -s legal/COMMERCIAL-LICENSE-HR.md
          test -s legal/DESKTOP_APACHE_2.0.txt
          test -s brand/logo.svg
          test -s src-tauri/icons/icon.ico
          ! grep -RIl --include='*.tsx' 'github.com/ghost_aiapp' src

  windows-startup:
    name: Build and open Ghost AI on Windows
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build production Windows binary
        run: pnpm tauri build --no-bundle
      - name: Stage packaged resources as in Portable.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'smoke/Portable' | Out-Null
          Copy-Item 'src-tauri/target/release/ghost-ai-desktop.exe' 'smoke/Portable/Ghost-AI.exe'
          foreach ($part in @('resources', 'builtin-skills')) {
            Copy-Item "src-tauri/$part" "smoke/Portable/$part" -Recurse -Force
          }
          Copy-Item 'legal' 'smoke/Portable/legal' -Recurse -Force
          if (-not (Test-Path 'smoke/Portable/resources/models_dev.json')) {
            throw 'Bundled model capabilities data missing'
          }
      - name: Require a persistent visible Ghost AI window
        id: startup
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ghost-ai-startup-diagnostics.ps1 -Executable 'smoke/Portable/Ghost-AI.exe' -OutputDirectory 'smoke/diagnostics' -ObserveSeconds 30
      - name: Save startup evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-AI-PR-Windows-Startup
          path: smoke/diagnostics/
          if-no-files-found: warn
      - name: Capture real running application for layout review
        id: screenshot
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ghost-ai-capture-screenshot.ps1 -Executable 'smoke/Portable/Ghost-AI.exe' -Output 'smoke/screenshots/ghost-ai-first-run.png'
      - name: Preserve real Windows screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-AI-PR-Windows-Screenshot
          path: smoke/screenshots/*.png
          if-no-files-found: warn
      - name: Block merge when the application does not open
        if: steps.startup.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Ghost AI Windows startup smoke test failed: no stable main window'
