# Ghost AI by Brendigo
name: Ghost AI Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghost-ai-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-advisories:
    name: Rust dependency security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec audit CLI
        shell: bash
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit desktop Cargo.lock (must have zero vulnerabilities)
        shell: bash
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Audit shared AI agent Cargo.lock (must have zero vulnerabilities)
        shell: bash
        run: cargo audit --file vendor/agent/Cargo.lock
  frontend:
    name: App quality and legal checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Signed manifest tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Inventory available npm dependency updates
        id: npm_outdated
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p reports
          pnpm outdated --recursive > reports/npm-outdated.txt 2>&1
      - name: Scan npm dependency advisories
        id: npm_audit
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p reports
          pnpm audit --audit-level low > reports/npm-security-audit.txt 2>&1
      - name: Publish dependency inventory and security findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Dependency-Audit
          path: |
            reports/npm-outdated.txt
            reports/npm-security-audit.txt
          if-no-files-found: warn
      - name: Reject any unresolved npm security audit findings
        if: steps.npm_audit.outcome != 'success'
        shell: bash
        run: |
          echo "::error::npm audit is not clean (low, moderate, high, or critical advisories). Review Ghost-AI-Dependency-Audit before release."
          tail -n 60 reports/npm-security-audit.txt || true
          exit 1
      - name: Review first-party code for maintainability and risk
        run: python3 scripts/ghost-ai-code-audit.py --output reports/ghost-ai-code-audit.md
      - name: Save Ghost AI source review
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Code-Review
          path: reports/ghost-ai-code-audit.md
          if-no-files-found: error
      - name: Verify legal notices and brand assets
        shell: bash
        run: |
          test -s legal/EULA-EN.txt
          test -s legal/EULA-HR.md
          test -s legal/COMMERCIAL-LICENSE-HR.md
          test -s legal/DESKTOP_APACHE_2.0.txt
          test -s brand/logo.svg
          test -s src-tauri/icons/icon.ico
          ! grep -RIl --include='*.tsx' 'github.com/ghost_aiapp' src

  windows-startup:
    name: Build and open Ghost AI on Windows
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build production Windows binary
        run: pnpm tauri build --no-bundle
      - name: Verify provider encryption and database rollback on Windows
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --lib providers::tests:: -- --nocapture --test-threads=1'
      - name: Stage packaged resources as in Portable.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'smoke/Portable' | Out-Null
          Copy-Item 'src-tauri/target/release/ghost-ai-desktop.exe' 'smoke/Portable/Ghost-AI.exe'
          foreach ($part in @('resources', 'builtin-skills')) {
            Copy-Item "src-tauri/$part" "smoke/Portable/$part" -Recurse -Force
          }
          Copy-Item 'legal' 'smoke/Portable/legal' -Recurse -Force
          if (-not (Test-Path 'smoke/Portable/resources/models_dev.json')) {
            throw 'Bundled model capabilities data missing'
          }
      - name: Require a persistent visible Ghost AI window
        id: startup
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ghost-ai-startup-diagnostics.ps1 -Executable 'smoke/Portable/Ghost-AI.exe' -OutputDirectory 'smoke/diagnostics' -ObserveSeconds 30
      - name: Save startup evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-PR-Windows-Startup
          path: smoke/diagnostics/
          if-no-files-found: warn
      - name: Observe early visible frames for white startup flashes
        id: first_paint
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ghost-ai-first-paint.ps1 -Executable 'smoke/Portable/Ghost-AI.exe' -OutputDirectory 'smoke/first-paint' -ObserveSeconds 18 -SampleIntervalMs 85
      - name: Preserve first-paint frames and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-PR-Windows-First-Paint
          path: smoke/first-paint/
          if-no-files-found: warn
      - name: Capture real app and Settings at supported desktop sizes
        id: screenshots
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'smoke/screenshots' | Out-Null
          $coverage = @()
          $captured = 0
          foreach ($size in @(
            @{ Width = 820; Height = 580 },
            @{ Width = 940; Height = 640 },
            @{ Width = 1160; Height = 760 },
            @{ Width = 1440; Height = 900 }
          )) {
            $label = "$($size.Width)x$($size.Height)"
            foreach ($surface in @('main', 'settings')) {
              try {
                $parameters = @{
                  Executable = 'smoke/Portable/Ghost-AI.exe'
                  Output = "smoke/screenshots/ghost-ai-$surface-$label.png"
                  ViewportWidth = $size.Width
                  ViewportHeight = $size.Height
                }
                if ($surface -eq 'settings') { $parameters.OpenSettings = $true }
                ./scripts/ghost-ai-capture-screenshot.ps1 @parameters
                $coverage += "CAPTURED $surface $label"
                $captured++
              } catch {
                $coverage += "NOT VERIFIED $surface $label - $($_.Exception.Message)"
              }
            }
          }
          $coverage | Set-Content -Path 'smoke/screenshots/coverage-report.txt'
          $coverage | ForEach-Object { Write-Host $_ }
          if ($captured -lt 2) {
            throw 'Unable to capture main and Settings surfaces on this CI desktop'
          }
      - name: Preserve screenshot evidence and skipped-viewport report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-PR-Windows-Screenshots
          path: smoke/screenshots/
          if-no-files-found: warn
      - name: Block merge when the application does not open or first paint cannot be verified
        if: steps.startup.outcome != 'success' || steps.first_paint.outcome != 'success' || steps.screenshots.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Ghost AI Windows verification failed; inspect startup, first-paint and screenshot artifacts'
