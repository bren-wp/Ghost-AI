name: Ghost AI Bootstrap v0.1.0

on:
  push:
    paths:
      - .github/workflows/ghost-ai-bootstrap.yml
      - scripts/ghost_import.py
      - scripts/ghost_icons.py
  workflow_dispatch:

concurrency:
  group: ghost-ai-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-source:
    name: Import and brand source
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - name: Checkout Ghost AI
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Clone reviewed desktop foundation
        run: |
          git clone --quiet --filter=blob:none https://github.com/chatshellapp/chatshell-desktop.git "$RUNNER_TEMP/ghost-core"
          git -C "$RUNNER_TEMP/ghost-core" checkout --detach 88e9e18666588943443c3a20730ab3765b53de39
          git clone --quiet --filter=blob:none https://github.com/chatshellapp/chatshell-agent.git "$RUNNER_TEMP/ghost-agent"
          git -C "$RUNNER_TEMP/ghost-agent" checkout --detach 9cbf50f0b7f6d300660adce0d7524528cd1d10f4
      - name: Import source and Ghost AI product identity
        env:
          GHOST_SOURCE_CORE: ${{ runner.temp }}/ghost-core
          GHOST_SOURCE_AGENT: ${{ runner.temp }}/ghost-agent
        run: python3 scripts/ghost_import.py
      - name: Generate original Ghost AI branding assets
        run: |
          python3 -m pip install --break-system-packages --quiet cairosvg
          python3 scripts/ghost_icons.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10'
      - name: Install UI dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Render native app icon set
        run: pnpm tauri icon brand/icon-1024.png --output src-tauri/icons
      - name: Commit Ghost AI source
        id: push
        run: |
          git config user.name "Ghost AI Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "feat: import Ghost AI 0.1.0 full branded desktop foundation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Ghost AI Windows
    needs: import-source
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.import-source.outputs.commit }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend build
        run: pnpm build
      - name: Build setup installer and portable binary
        run: pnpm tauri build --bundles nsis
      - name: Package verified release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Missing NSIS setup executable' }
          Copy-Item $setup.FullName "release/Ghost-AI-v0.1.0-Setup.exe"
          $exe = "src-tauri/target/release/ghost-ai-desktop.exe"
          if (-not (Test-Path $exe)) { throw 'Missing Windows application executable' }
          Copy-Item $exe "release/Ghost-AI-v0.1.0-Portable.exe"
          New-Item -ItemType Directory -Force "release/Portable" | Out-Null
          Copy-Item $exe "release/Portable/Ghost-AI.exe"
          Copy-Item "src-tauri/resources" "release/Portable/resources" -Recurse -ErrorAction Stop
          Copy-Item "src-tauri/builtin-skills" "release/Portable/builtin-skills" -Recurse -ErrorAction Stop
          Compress-Archive -Path "release/Portable/*" -DestinationPath "release/Ghost-AI-v0.1.0-Portable.zip"
          if ((Get-Item "release/Ghost-AI-v0.1.0-Setup.exe").Length -lt 50000) { throw 'Installer is too small' }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-AI-v0.1.0-Windows
          path: release/Ghost-AI-*
          if-no-files-found: error

  publish-release:
    name: Publish Ghost AI v0.1.0
    needs: [import-source, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: Ghost-AI-v0.1.0-Windows
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ needs.import-source.outputs.commit }}
          name: Ghost AI v0.1.0
          prerelease: true
          generate_release_notes: false
          body: |
            Ghost AI 0.1.0 — initial branded desktop preview.

            Includes a Windows installer and portable packaging built from source.
            Unsigned builds can trigger Windows SmartScreen. Treat portable support
            as preliminary pending clean-device testing.

            This release retains legally required upstream license notices.
          files: |
            release/Ghost-AI-v0.1.0-Setup.exe
            release/Ghost-AI-v0.1.0-Portable.exe
            release/Ghost-AI-v0.1.0-Portable.zip
