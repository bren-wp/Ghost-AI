name: Ghost AI Code Identity
on:
  push:
    branches:
      - feat/commercial-distribution-updates
    paths:
      - scripts/ghost_headers.py

permissions:
  contents: write

jobs:
  brand-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/commercial-distribution-updates
          persist-credentials: true
      - name: Apply consistent source headers
        run: python3 scripts/ghost_headers.py
      - name: Commit updated source identity
        run: |
          git config user.name "Ghost AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri scripts public
          if ! git diff --cached --quiet; then
            git commit -m "style: standardize Ghost AI by Brendigo source headers"
            git pull --rebase origin feat/commercial-distribution-updates
            git push origin HEAD:feat/commercial-distribution-updates
          fi
