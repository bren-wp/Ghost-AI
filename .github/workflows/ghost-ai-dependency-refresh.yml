# Ghost AI by Brendigo
# PR #40 compatible/latest-toolchain candidate. Build and tests must pass
# before any dependency manifests or lockfiles are committed to the PR.
name: Ghost AI dependency refresh (PR40)

on:
  push:
    branches:
      - fix/ghost-ai-main-rust-visual-gates-20261122
    paths:
      - .github/workflows/ghost-ai-dependency-refresh.yml

permissions:
  contents: write

concurrency:
  group: ghost-ai-pr40-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'bren-wp/Ghost-AI' && github.ref == 'refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from pinned current locks
        run: pnpm install --frozen-lockfile
      - name: Update compatible npm packages and the complete latest Vite test toolchain
        shell: bash
        run: |
          set -euo pipefail
          pnpm up
          # React plugin 6 imports vite/internal, which does not exist in Vite 6.
          # Upgrade Vite, the React plugin and Vitest together; do not
          # create an incompatible mixed-version lockfile.
          pnpm add -D \
            '@typescript-eslint/eslint-plugin@^8.73.0' \
            '@typescript-eslint/parser@^8.73.0' \
            'vite@^8.3.8' \
            '@vitejs/plugin-react@^6.3.0' \
            'vitest@^5.1.1' \
            '@vitest/coverage-v8@^5.1.1' \
            'jsdom@^31.0.1' \
            '@testing-library/jest-dom@^8.0.0'
          pnpm install --frozen-lockfile
      - name: Upgrade both Cargo workspaces within declared compatible ranges
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml
          cargo update --manifest-path vendor/agent/Cargo.toml
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path vendor/agent/Cargo.toml --no-deps --format-version 1 >/dev/null
      - name: Test updated frontend and dependency security
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          pnpm test
          pnpm audit --audit-level low
      - name: Commit only fully resolved dependency locks
        shell: bash
        run: |
          set -euo pipefail
          git add package.json pnpm-lock.yaml src-tauri/Cargo.toml src-tauri/Cargo.lock vendor/agent/Cargo.toml vendor/agent/Cargo.lock
          if git diff --cached --quiet; then
            echo "Already using the newest versions allowed by current compatibility declarations"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): refresh latest compatible npm and Cargo locks'
          git fetch origin refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/fix/ghost-ai-main-rust-visual-gates-20261122
