name: Ghost AI Consolidated Dependency Refresh
on:
  push:
    branches:
      - release/v0.1.1
    paths:
      - scripts/ghost-dependency-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and validate merged dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Consolidate pending npm dependency updates
        run: |
          pnpm up 'zustand@^5.1.0' 'i18next@^27.2.0' '@testing-library/jest-dom@^7.0.1'
      - name: Verify TypeScript and UI tests
        run: |
          pnpm build
          pnpm test
      - name: Refresh compatible Rust dependencies
        run: |
          cargo update --manifest-path src-tauri/Cargo.toml -p serde --precise 1.0.229
          cargo update --manifest-path src-tauri/Cargo.toml -p tauri-plugin-fs --precise 2.5.2
      - name: Commit consolidated dependency updates
        run: |
          git config user.name "Ghost AI Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): consolidate validated cloud UI and Rust patch updates"
            git pull --rebase origin release/v0.1.1
            git push origin HEAD:release/v0.1.1
          fi
