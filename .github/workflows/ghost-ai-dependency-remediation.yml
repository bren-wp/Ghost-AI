# One-time security remediation for trusted Ghost AI PR #26.
# Remove this workflow once updated lockfiles are committed and reviewed.
name: Ghost AI dependency security remediation
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - vendor/agent/Cargo.toml
      - vendor/agent/crates/ghost-ai-agent-core/Cargo.toml
      - .github/workflows/ghost-ai-dependency-remediation.yml

jobs:
  regenerate-and-verify:
    if: ${{ github.event.pull_request.number == 26 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ghost-ai-dark-responsive-localization' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - name: Checkout trusted head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve patched frontend dependency graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm update --recursive
          pnpm install --frozen-lockfile

      - name: Resolve patched native and agent lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path vendor/agent/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml

      - name: Assert none of the 12 known RustSec vulnerabilities remain
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, tomllib

          def version(s):
              return tuple(int(x) for x in s.split('-')[0].split('.')[:3])

          for p in (pathlib.Path("src-tauri/Cargo.lock"), pathlib.Path("vendor/agent/Cargo.lock")):
              packages = tomllib.loads(p.read_text(encoding="utf-8"))["package"]
              known = {
                  "calamine": (0, 38, 0),
                  "lopdf": (0, 42, 0),
                  "zip": (9, 0, 5),
                  "libsqlite3-sys": (0, 39, 0),
                  "rsa": (0, 10, 0),
              }
              offenders = [
                  f"{pkg['name']}@{pkg['version']}"
                  for pkg in packages
                  if pkg["name"] in known and version(pkg["version"]) < known[pkg["name"]]
              ]
              print(f"{p}: {len(packages)} packages; known vulnerable dependencies: {offenders}")
              if offenders:
                  raise SystemExit("Known RustSec dependency versions remain in the lockfile")
          PY

      - name: Verify frontend build and all existing unit tests
        shell: bash
        run: |
          pnpm build
          pnpm test

      - name: Compile shared native agent using the patched dependencies
        shell: bash
        run: |
          cargo check --manifest-path vendor/agent/Cargo.toml -p ghost-ai-agent-core --locked

      - name: Upload regenerated lockfiles and diagnostics even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-AI-Patched-Lockfiles-Review
          path: |
            pnpm-lock.yaml
            src-tauri/Cargo.lock
            vendor/agent/Cargo.lock
          if-no-files-found: error

      - name: Commit patched lockfiles to the same trusted PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml src-tauri/Cargo.lock vendor/agent/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles already match secure manifests'
            exit 0
          fi
          git commit -m 'fix(deps): regenerate security-patched npm and Rust lockfiles'
          git push origin HEAD:refs/heads/fix/ghost-ai-dark-responsive-localization
