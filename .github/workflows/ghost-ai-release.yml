# Ghost AI by Brendigo
name: Ghost AI — Release Packages

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:

concurrency:
  group: ghost-ai-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate source and legal assets
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify matching release versions
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release reference: $tag"; exit 1; }
          version="${tag#v}"
          python3 -c 'import json,sys; v=sys.argv[1]; assert json.load(open("package.json"))["version"] == v; assert json.load(open("src-tauri/tauri.conf.json"))["version"] == v' "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify legal and brand files
        run: |
          for f in legal/EULA-EN.txt legal/EULA-HR.md legal/COMMERCIAL-LICENSE-HR.md legal/THIRD_PARTY_NOTICES.md brand/logo.svg brand/banner.svg; do test -s "$f"; done
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript bundle
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Manifest security tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit source boundaries and potential dead modules before release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ghost-ai-code-audit.py scripts/ghost-ai-dead-code-audit.py
          python3 scripts/ghost-ai-code-audit.py --output reports/ghost-ai-code-audit.md
          python3 scripts/ghost-ai-dead-code-audit.py --output reports/ghost-ai-dead-code-audit.md
          python3 scripts/ghost-ai-localization-audit.py --output reports/ghost-ai-localization-audit.md
      - name: Reject vulnerable frontend dependencies before publishing
        run: pnpm audit --audit-level low
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec audit CLI
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Reject vulnerable Rust dependencies before publishing
        shell: bash
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file vendor/agent/Cargo.lock

  windows:
    name: Windows setup, portable, update
    runs-on: windows-2022
    needs: validate
    timeout-minutes: 85
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GHOST_AI_UPDATER_PUBLIC_KEY: ${{ secrets.GHOST_AI_UPDATER_PUBLIC_KEY }}
      VITE_GHOST_AI_UPDATES: ${{ secrets.GHOST_AI_UPDATER_PUBLIC_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Configure trusted updater
        run: python scripts/configure_updater.py
      - name: Prepare Ghost AI installation artwork
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python scripts/ghost_installer_art.py
      - name: Build Windows
        run: pnpm tauri build --bundles nsis
      # Reuse the release-profile Rust dependencies from the production build
      # rather than recompiling the entire tree again in debug profile.
      # The PR Quality Gates independently execute the complete debug-mode test suite.
      - name: Execute all production-profile Windows Rust library tests
        timeout-minutes: 40
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib -- --nocapture --test-threads=1
      - name: Package Ghost AI Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.validate.outputs.release_tag }}"
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Ghost AI Setup executable was built' }
          Copy-Item $installer.FullName "release/Ghost-AI-$version-Setup.exe"
          $binary = 'src-tauri/target/release/ghost-ai-desktop.exe'
          if (-not (Test-Path $binary)) { throw 'Missing Ghost AI executable' }
          New-Item -ItemType Directory -Force 'release/Portable' | Out-Null
          Copy-Item $binary 'release/Portable/Ghost-AI.exe'
          foreach ($part in @('resources','builtin-skills')) {
            $source = "src-tauri/$part"
            if (-not (Test-Path $source)) { throw "Missing packaged resource: $source" }
            Copy-Item $source "release/Portable/$part" -Recurse -Force
          }
          Copy-Item 'legal' 'release/Portable/legal' -Recurse -Force
          Compress-Archive -Path 'release/Portable/*' -DestinationPath "release/Ghost-AI-$version-Portable.zip" -Force
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis --yes --no-progress
            $makensisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          } else {
            $makensisPath = $makensis.Source
          }
          if (-not (Test-Path $makensisPath)) { throw 'NSIS is unavailable: cannot create a real Portable.exe' }
          $out = Join-Path (Get-Location).Path "release/Ghost-AI-$version-Portable.exe"
          $payload = Join-Path (Get-Location).Path 'release/Portable'
          $icon = (Resolve-Path 'src-tauri/icons/icon.ico').Path
          $number = $version.TrimStart('v')
          & $makensisPath /V2 "/DOUTPUT_FILE=$out" "/DPAYLOAD=$payload" "/DICON_FILE=$icon" "/DPRODUCT_VERSION=$number" "scripts/ghost-portable.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'Portable.exe creation failed' }
          if ((Get-Item $out).Length -lt 10000000) { throw 'Portable package appears incomplete' }
          $updateOut = Join-Path (Get-Location).Path "release/Ghost-AI-$version-Update.exe"
          & $makensisPath /V2 "/DOUTPUT_FILE=$updateOut" "/DSETUP_FILE=$($installer.FullName)" "/DICON_FILE=$icon" "/DPRODUCT_VERSION=$number" "scripts/ghost-update.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'Update.exe creation failed' }
          if ((Get-Item $updateOut).Length -lt 10000000) { throw 'Update package appears incomplete' }
          $updaters = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.nsis.zip*' -ErrorAction SilentlyContinue
          if ($env:VITE_GHOST_AI_UPDATES -eq 'true' -and !$updaters) { throw 'Configured signing but no signed NSIS updater was produced' }
          foreach ($asset in $updaters) { Copy-Item $asset.FullName "release/$($asset.Name)" }
          Get-ChildItem 'release/Ghost-AI-*' -File | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() + '  ' + $_.Name
          } | Set-Content -Encoding utf8 'release/SHA256SUMS.txt'
      - name: Prove packaged Ghost AI launches on Windows
        id: live_startup
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ghost-ai-startup-diagnostics.ps1 -Executable 'release/Portable/Ghost-AI.exe' -OutputDirectory release-startup-diagnostics -ObserveSeconds 25
      - name: Preserve Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Windows-Startup-Diagnostics
          path: release-startup-diagnostics/
          if-no-files-found: warn
      - name: Reject non-starting Windows packages
        if: steps.live_startup.outcome != 'success'
        shell: pwsh
        run: throw 'The packaged Ghost AI executable failed its startup health check'
      - name: Prove Portable.exe starts its bundled Ghost AI window
        id: portable_health
        shell: pwsh
        continue-on-error: true
        run: |
          $tag = "${{ needs.validate.outputs.release_tag }}"
          ./scripts/ghost-ai-test-portable.ps1 -Launcher "release/Ghost-AI-$tag-Portable.exe" -OutputDirectory 'release-portable-diagnostics'
      - name: Preserve portable launcher evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Windows-Portable-Diagnostics
          path: release-portable-diagnostics/
          if-no-files-found: warn
      - name: Reject broken Portable.exe launchers
        if: steps.portable_health.outcome != 'success'
        shell: pwsh
        run: throw 'Ghost AI Portable.exe failed to start the bundled application'
      - name: Verify Setup.exe installation and Update.exe maintenance
        id: installer_health
        shell: pwsh
        continue-on-error: true
        run: |
          $tag = "${{ needs.validate.outputs.release_tag }}"
          ./scripts/ghost-ai-test-installation.ps1 -Setup "release/Ghost-AI-$tag-Setup.exe" -Update "release/Ghost-AI-$tag-Update.exe" -OutputDirectory 'release-installer-diagnostics'
      - name: Preserve installer and update diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Windows-Setup-Update-Diagnostics
          path: release-installer-diagnostics/
          if-no-files-found: warn
      - name: Reject non-working setup or update packages
        if: steps.installer_health.outcome != 'success'
        shell: pwsh
        run: throw 'Ghost AI setup or update package failed its real Windows installation test'
      - name: Capture a real first-run Ghost AI screenshot
        shell: pwsh
        continue-on-error: true
        run: |
          pwsh -NoProfile -File scripts/ghost-ai-capture-screenshot.ps1 -Executable 'release/Portable/Ghost-AI.exe' -Output 'screenshots/ghost-ai-first-run.png'
      - name: Save real Ghost AI screenshots for visual review
        uses: actions/upload-artifact@v7
        with:
          name: GhostAI-Screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
      - name: Publish Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Windows
          path: |
            release/Ghost-AI-*
            release/SHA256SUMS.txt
          if-no-files-found: error

  linux:
    name: Linux installer (DEB) and portable (AppImage)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GHOST_AI_UPDATER_PUBLIC_KEY: ${{ secrets.GHOST_AI_UPDATER_PUBLIC_KEY }}
      VITE_GHOST_AI_UPDATES: ${{ secrets.GHOST_AI_UPDATER_PUBLIC_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Test all Rust library paths on Linux
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: python3 scripts/configure_updater.py
      - name: Build Linux
        run: pnpm tauri build --bundles appimage,deb
      - name: Package Linux
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release/Ghost-AI-${{ needs.validate.outputs.release_tag }}-Linux.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "release/Ghost-AI-${{ needs.validate.outputs.release_tag }}-Linux.deb"
          find src-tauri/target/release/bundle -type f \( -name '*.AppImage.tar.gz' -o -name '*.sig' \) -exec cp {} release/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-Linux
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS installer (DMG) and portable (.app.zip)
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GHOST_AI_UPDATER_PUBLIC_KEY: ${{ secrets.GHOST_AI_UPDATER_PUBLIC_KEY }}
      VITE_GHOST_AI_UPDATES: ${{ secrets.GHOST_AI_UPDATER_PUBLIC_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Test all Rust library paths on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: python3 scripts/configure_updater.py
      - name: Build macOS
        run: pnpm tauri build --bundles app,dmg
      - name: Package macOS installer and portable app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${{ needs.validate.outputs.release_tag }}"
          cp src-tauri/target/release/bundle/dmg/*.dmg "release/Ghost-AI-$tag-macOS.dmg"
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app" && test -s "$app/Contents/Info.plist" || { echo 'Missing macOS .app bundle'; exit 1; }
          # ditto preserves macOS app metadata, unlike a generic ZIP packer.
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/Ghost-AI-$tag-macOS-Portable.zip"
          unzip -t "release/Ghost-AI-$tag-macOS-Portable.zip" >/dev/null
          test -s "release/Ghost-AI-$tag-macOS-Portable.zip"
          find src-tauri/target/release/bundle -type f \( -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} release/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: Ghost-AI-macOS
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish versioned Ghost AI release
    runs-on: ubuntu-24.04
    needs: [validate, windows, linux, macos]
    if: always() && needs.validate.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Ghost-AI-Windows
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: Ghost-AI-Linux
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: Ghost-AI-macOS
          path: release
      - name: Verify all platform assets and complete checksums
        shell: bash
        run: |
          tag="${{ needs.validate.outputs.release_tag }}"
          for suffix in Setup.exe Portable.exe Portable.zip Update.exe Linux.AppImage Linux.deb macOS.dmg macOS-Portable.zip; do
            test -s "release/Ghost-AI-$tag-$suffix" || { echo "Missing release asset: $suffix"; exit 1; }
          done
          cd release
          sha256sum Ghost-AI-* > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -ge 8
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release/*
