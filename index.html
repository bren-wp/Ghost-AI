<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ghost-ai-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the saved theme (the `.dark` class) before first paint. -->
    <script src="/theme-init.js"></script>
    <title>Ghost AI</title>
    <style>
      /*
       * Critical inline styles: paint the app's background and a splash
       * view the moment the WebView can draw, before any JS or CSS bundle
       * arrives. The splash lives inside #root and is replaced by React on
       * its first commit. Geometry, colors, and timing mirror
       * src/components/ui/morph-spinner.tsx (SMIL — no JS required); the
       * 16px size matches the in-chat streaming indicator.
       */
      html {
        background-color: oklch(1 0 0);
      }
      html.dark {
        background-color: oklch(0.145 0 0);
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          display: none;
        }
      }
    #splash{flex-direction:column;gap:16px;color:#e5e7eb;font:600 22px Arial,sans-serif}#splash img{border-radius:20px;box-shadow:0 0 45px #00e5ff33}html,html.dark{background-color:#080f1a}</style>
  </head>

  <body>
    <div id="root">
      <div id="splash"><img src="/ghost-ai-icon.png" width="94" height="94" alt="Ghost AI" /><strong>Ghost AI</strong></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
